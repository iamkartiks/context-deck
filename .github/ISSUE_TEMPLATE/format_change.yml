name: A session failed to parse
description: contextdeck doctor shows a parse failure, or a session looks wrong (bad title, missing messages, wrong counts)
labels: [format-change]
body:
  - type: markdown
    attributes:
      value: |
        Tools change their session formats without notice; reports like this are how adapters stay current. Thank you!

        **Please do not paste real transcripts.** Replace prompts, code, paths and anything secret with placeholders. We only need the *shape* of the line.
  - type: dropdown
    id: tool
    attributes:
      label: Which tool wrote the session?
      options: [Claude Code, Codex CLI, Other]
    validations:
      required: true
  - type: input
    id: tool-version
    attributes:
      label: Tool version
      description: e.g. output of `claude --version` or `codex --version`
  - type: textarea
    id: doctor
    attributes:
      label: Output of `contextdeck doctor`
      render: text
  - type: textarea
    id: sample
    attributes:
      label: A redacted sample of the line(s) that fail or look wrong
      description: JSON with values replaced, e.g. {"type":"…","payload":{"type":"new_thing","text":"<redacted>"}}
      render: json
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to see?

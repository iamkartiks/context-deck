name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
        include:
          # Windows support is not verified yet; run it so we learn, but don't block merges.
          - os: windows-latest
            node: 22
            experimental: true
    continue-on-error: ${{ matrix.experimental == true }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Smoke test the CLI on the fixtures
        shell: bash
        run: |
          node bin/contextdeck.js --home .ci --claude-dir fixtures/claude --codex-dir fixtures/codex --qwen-dir fixtures/qwen index
          node bin/contextdeck.js --home .ci --claude-dir fixtures/claude --codex-dir fixtures/codex --qwen-dir fixtures/qwen list
          node bin/contextdeck.js --home .ci --claude-dir fixtures/claude --codex-dir fixtures/codex --qwen-dir fixtures/qwen search cookie
